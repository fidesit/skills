<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 920" width="1080" height="920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#101C30"/>
      <stop offset="100%" stop-color="#0B2240"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3A94C4"/>
      <stop offset="100%" stop-color="#2178A8"/>
    </linearGradient>
    <linearGradient id="phaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2178A8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2178A8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2178A8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2178A8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="0.6" fill="#2178A8" opacity="0.06"/>
    </pattern>

    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3A94C4"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#CC9A06"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="920" fill="url(#bg)"/>
  <rect width="1080" height="920" fill="url(#dots)"/>
  <rect width="1080" height="920" fill="url(#glow)"/>

  <!-- Corner accents -->
  <line x1="0" y1="0" x2="0" y2="60" stroke="#2178A8" stroke-width="3" opacity="0.2"/>
  <line x1="0" y1="0" x2="60" y2="0" stroke="#2178A8" stroke-width="3" opacity="0.2"/>
  <line x1="1080" y1="920" x2="1080" y2="860" stroke="#2178A8" stroke-width="3" opacity="0.2"/>
  <line x1="1080" y1="920" x2="1020" y2="920" stroke="#2178A8" stroke-width="3" opacity="0.2"/>

  <!-- ================================ -->
  <!-- LOGO                             -->
  <!-- ================================ -->
  <g transform="translate(48, 36) scale(0.48)">
    <path fill-rule="evenodd"
      d="M4 5 C4 2,6.5 0,9 0 L67 0 C69.5 0,72 2,72 5 L72 44 C72 64,57 80,38 80 C19 80,4 64,4 44 Z M16 12 L16 42 C16 56,26 64,38 64 C50 64,60 56,60 42 L60 12 L50 12 L50 42 C50 50,45 54,38 54 C31 54,26 50,26 42 L26 12 Z"
      fill="url(#logoGrad)"/>
  </g>
  <text x="88" y="62" font-family="'Sora','Inter',sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#FFFFFF">Utisha</text>

  <!-- ================================ -->
  <!-- HEADLINE                         -->
  <!-- ================================ -->
  <text x="540" y="128" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Peer-Reviewed Document</text>
  <text x="540" y="178" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Generation Pipeline</text>
  <text x="540" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="17" font-weight="600" letter-spacing="4" fill="#5BADD6">MULTI-AGENT SKILL · CLAUDE CODE</text>

  <!-- ================================ -->
  <!-- PHASE 1 — SOURCE FETCH           -->
  <!-- ================================ -->
  <rect x="60" y="260" width="220" height="90" rx="8" fill="#123B5C" stroke="#2178A8" stroke-width="1.5" opacity="0.9"/>
  <text x="96" y="293" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#5BADD6">PHASE 1</text>
  <text x="96" y="316" font-family="'Sora','Inter',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Source Fetch</text>
  <text x="96" y="336" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" fill="#8DC8E8">URLs, laws, references</text>
  <!-- Icon: download -->
  <circle cx="252" cy="295" r="14" fill="#2178A8" opacity="0.2"/>
  <path d="M247,292 L257,292 M252,287 L252,299 M248,296 L252,300 L256,296" stroke="#5BADD6" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="305" x2="340" y2="305" stroke="#3A94C4" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ================================ -->
  <!-- PHASE 2 — DRAFT                  -->
  <!-- ================================ -->
  <rect x="348" y="260" width="220" height="90" rx="8" fill="#123B5C" stroke="#2178A8" stroke-width="1.5" opacity="0.9"/>
  <text x="384" y="293" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#5BADD6">PHASE 2</text>
  <text x="384" y="316" font-family="'Sora','Inter',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Draft Generation</text>
  <text x="384" y="336" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" fill="#8DC8E8">Structured doc from sources</text>
  <!-- Icon: document -->
  <circle cx="540" cy="295" r="14" fill="#2178A8" opacity="0.2"/>
  <rect x="533" y="285" width="14" height="18" rx="2" fill="none" stroke="#5BADD6" stroke-width="1.5"/>
  <line x1="536" y1="291" x2="544" y2="291" stroke="#5BADD6" stroke-width="1" opacity="0.6"/>
  <line x1="536" y1="295" x2="544" y2="295" stroke="#5BADD6" stroke-width="1" opacity="0.6"/>
  <line x1="536" y1="299" x2="541" y2="299" stroke="#5BADD6" stroke-width="1" opacity="0.6"/>

  <!-- Arrow 2→3 -->
  <line x1="568" y1="305" x2="628" y2="305" stroke="#3A94C4" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ================================ -->
  <!-- PHASE 3 — FAN-OUT HEADER         -->
  <!-- ================================ -->
  <rect x="636" y="260" width="390" height="90" rx="8" fill="#123B5C" stroke="#2178A8" stroke-width="1.5" opacity="0.9"/>
  <text x="672" y="293" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#5BADD6">PHASE 3</text>
  <text x="672" y="316" font-family="'Sora','Inter',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Parallel Review</text>
  <text x="785" y="316" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="14" font-weight="600" fill="#CC9A06">5 agents in parallel</text>
  <text x="672" y="336" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" fill="#8DC8E8">Each returns PASS or FAIL with issues</text>
  <!-- Icon: fan-out -->
  <circle cx="998" cy="295" r="14" fill="#2178A8" opacity="0.2"/>
  <line x1="993" y1="295" x2="1003" y2="288" stroke="#5BADD6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="993" y1="295" x2="1003" y2="295" stroke="#5BADD6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="993" y1="295" x2="1003" y2="302" stroke="#5BADD6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ================================ -->
  <!-- 5 REVIEWER CARDS (fan-out)       -->
  <!-- ================================ -->

  <!-- Fan-out lines from Phase 3 -->
  <line x1="831" y1="350" x2="831" y2="380" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="831" y1="380" x2="140" y2="380" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="831" y1="380" x2="1020" y2="380" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>

  <!-- Vertical drop lines to each card -->
  <line x1="140" y1="380" x2="140" y2="400" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="380" x2="360" y2="400" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="580" y1="380" x2="580" y2="400" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="380" x2="800" y2="400" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="1000" y1="380" x2="1000" y2="400" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>

  <!-- Reviewer 1: Accuracy -->
  <rect x="60" y="400" width="180" height="130" rx="8" fill="#1a3828" stroke="#38b888" stroke-width="1.5" opacity="0.9"/>
  <rect x="60" y="400" width="180" height="130" rx="8" fill="#38b888" opacity="0.05"/>
  <circle cx="86" cy="428" r="12" fill="#38b888" opacity="0.2"/>
  <text x="86" y="432" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="700" fill="#90e8c0">1</text>
  <text x="106" y="432" font-family="'Sora','Inter',sans-serif" font-size="15" font-weight="700" fill="#90e8c0">Accuracy</text>
  <text x="78" y="458" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#88b898">Cross-reference every</text>
  <text x="78" y="474" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#88b898">claim against source</text>
  <text x="78" y="490" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#88b898">material.</text>
  <text x="78" y="516" font-family="'JetBrains Mono',monospace" font-size="10" fill="#38b888" opacity="0.7">VERIFIED | CONFLICT</text>

  <!-- Reviewer 2: Completeness -->
  <rect x="260" y="400" width="180" height="130" rx="8" fill="#182e4a" stroke="#5098e0" stroke-width="1.5" opacity="0.9"/>
  <rect x="260" y="400" width="180" height="130" rx="8" fill="#5098e0" opacity="0.05"/>
  <circle cx="286" cy="428" r="12" fill="#5098e0" opacity="0.2"/>
  <text x="286" y="432" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="700" fill="#98c8f8">2</text>
  <text x="306" y="432" font-family="'Sora','Inter',sans-serif" font-size="15" font-weight="700" fill="#98c8f8">Completeness</text>
  <text x="278" y="458" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#88a8c0">Audit document against</text>
  <text x="278" y="474" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#88a8c0">user-provided checklist.</text>
  <text x="278" y="490" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#88a8c0">No gaps allowed.</text>
  <text x="278" y="516" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5098e0" opacity="0.7">COVERED | MISSING</text>

  <!-- Reviewer 3: Overlap -->
  <rect x="460" y="400" width="180" height="130" rx="8" fill="#2e1c48" stroke="#9068d8" stroke-width="1.5" opacity="0.9"/>
  <rect x="460" y="400" width="180" height="130" rx="8" fill="#9068d8" opacity="0.05"/>
  <circle cx="486" cy="428" r="12" fill="#9068d8" opacity="0.2"/>
  <text x="486" y="432" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="700" fill="#c8a8f8">3</text>
  <text x="506" y="432" font-family="'Sora','Inter',sans-serif" font-size="15" font-weight="700" fill="#c8a8f8">Overlap</text>
  <text x="478" y="458" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#a090c0">Detect rules that both</text>
  <text x="478" y="474" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#a090c0">match same input, or</text>
  <text x="478" y="490" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#a090c0">inputs with no rule.</text>
  <text x="478" y="516" font-family="'JetBrains Mono',monospace" font-size="10" fill="#9068d8" opacity="0.7">OVERLAPS | DEAD_ENDS</text>

  <!-- Reviewer 4: Probe -->
  <rect x="660" y="400" width="180" height="130" rx="8" fill="#3a3018" stroke="#e0a848" stroke-width="1.5" opacity="0.9"/>
  <rect x="660" y="400" width="180" height="130" rx="8" fill="#e0a848" opacity="0.05"/>
  <circle cx="686" cy="428" r="12" fill="#e0a848" opacity="0.2"/>
  <text x="686" y="432" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="700" fill="#ffd888">4</text>
  <text x="706" y="432" font-family="'Sora','Inter',sans-serif" font-size="15" font-weight="700" fill="#ffd888">Probe</text>
  <text x="678" y="458" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#c0a880">Run test cases using</text>
  <text x="678" y="474" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#c0a880">only the document as</text>
  <text x="678" y="490" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#c0a880">reference. No cheating.</text>
  <text x="678" y="516" font-family="'JetBrains Mono',monospace" font-size="10" fill="#e0a848" opacity="0.7">OK | AMBIGUOUS</text>

  <!-- Reviewer 5: Temporal -->
  <rect x="860" y="400" width="180" height="130" rx="8" fill="#3a2028" stroke="#e06058" stroke-width="1.5" opacity="0.9"/>
  <rect x="860" y="400" width="180" height="130" rx="8" fill="#e06058" opacity="0.05"/>
  <circle cx="886" cy="428" r="12" fill="#e06058" opacity="0.2"/>
  <text x="886" y="432" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="700" fill="#ff9e98">5</text>
  <text x="906" y="432" font-family="'Sora','Inter',sans-serif" font-size="15" font-weight="700" fill="#ff9e98">Temporal</text>
  <text x="878" y="458" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#c09898">Verify effective dates,</text>
  <text x="878" y="474" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#c09898">transition periods, and</text>
  <text x="878" y="490" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#c09898">sunset clauses.</text>
  <text x="878" y="516" font-family="'JetBrains Mono',monospace" font-size="10" fill="#e06058" opacity="0.7">DATES | TRANSITIONS</text>

  <!-- ================================ -->
  <!-- CONVERGENCE — PHASE 4            -->
  <!-- ================================ -->

  <!-- Converge lines from all 5 cards -->
  <line x1="140" y1="530" x2="140" y2="560" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="530" x2="360" y2="560" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="580" y1="530" x2="580" y2="560" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="530" x2="800" y2="560" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="1000" y1="530" x2="1000" y2="560" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="140" y1="560" x2="1000" y2="560" stroke="#3A94C4" stroke-width="1" opacity="0.3"/>
  <line x1="540" y1="560" x2="540" y2="585" stroke="#3A94C4" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Phase 4: Convergence check -->
  <rect x="380" y="590" width="320" height="70" rx="8" fill="#123B5C" stroke="#2178A8" stroke-width="1.5" opacity="0.9"/>
  <text x="416" y="618" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#5BADD6">PHASE 4</text>
  <text x="416" y="641" font-family="'Sora','Inter',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Convergence Check</text>
  <text x="616" y="641" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="13" fill="#8DC8E8">all PASS?</text>

  <!-- ================================ -->
  <!-- BRANCH: FAIL → Phase 5 (loop)    -->
  <!-- ================================ -->

  <!-- FAIL branch — loops back up to Phase 2 -->
  <line x1="380" y1="625" x2="30" y2="625" stroke="#CC9A06" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="30" y1="625" x2="30" y2="305" stroke="#CC9A06" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="30" y1="305" x2="52" y2="305" stroke="#CC9A06" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowLoop)" opacity="0.5"/>

  <!-- FAIL label -->
  <rect x="320" y="612" width="50" height="22" rx="4" fill="#3a3018"/>
  <text x="345" y="627" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="11" font-weight="700" fill="#CC9A06">FAIL</text>

  <!-- Phase 5 label on the loop -->
  <rect x="10" y="448" width="36" height="110" rx="6" fill="#3a3018" stroke="#CC9A06" stroke-width="1" opacity="0.8"/>
  <text x="28" y="476" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#CC9A06" transform="rotate(-90, 28, 503)">PHASE 5 · REVISE</text>

  <!-- ================================ -->
  <!-- BRANCH: PASS → Phase 6           -->
  <!-- ================================ -->

  <!-- PASS arrow down -->
  <line x1="540" y1="660" x2="540" y2="690" stroke="#38b888" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- PASS label -->
  <rect x="702" y="612" width="52" height="22" rx="4" fill="#1a3828"/>
  <text x="728" y="627" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="11" font-weight="700" fill="#38b888">PASS</text>
  <line x1="700" y1="625" x2="665" y2="625" stroke="#38b888" stroke-width="1" opacity="0.3"/>

  <!-- Phase 6: Human gate -->
  <rect x="370" y="695" width="340" height="100" rx="10" fill="#123B5C" stroke="#3A94C4" stroke-width="2" opacity="0.95"/>
  <rect x="370" y="695" width="340" height="100" rx="10" fill="#2178A8" opacity="0.06"/>
  <text x="406" y="728" font-family="'Sora','Inter',sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#5BADD6">PHASE 6</text>
  <text x="406" y="754" font-family="'Sora','Inter',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Human Approval Gate</text>
  <text x="406" y="778" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" fill="#8DC8E8">Review verdicts, iteration count, unresolved issues</text>

  <!-- Human icon -->
  <circle cx="680" cy="725" r="14" fill="#3A94C4" opacity="0.2"/>
  <circle cx="680" cy="720" r="5" fill="none" stroke="#8DC8E8" stroke-width="1.5"/>
  <path d="M670,735 Q680,728 690,735" fill="none" stroke="#8DC8E8" stroke-width="1.5"/>

  <!-- Approve / Reject labels -->
  <rect x="450" y="808" width="80" height="24" rx="5" fill="#1a3828" stroke="#38b888" stroke-width="1"/>
  <text x="490" y="824" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="11" font-weight="700" fill="#90e8c0">APPROVE</text>

  <rect x="550" y="808" width="70" height="24" rx="5" fill="#3a2028" stroke="#e06058" stroke-width="1"/>
  <text x="585" y="824" text-anchor="middle" font-family="'Sora','Inter',sans-serif" font-size="11" font-weight="700" fill="#ff9e98">REJECT</text>

  <!-- Reject loops back to Phase 2 -->
  <line x1="620" y1="820" x2="1050" y2="820" stroke="#e06058" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>
  <line x1="1050" y1="820" x2="1050" y2="305" stroke="#e06058" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>
  <line x1="1050" y1="305" x2="1034" y2="305" stroke="#e06058" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>

  <!-- Save arrow -->
  <line x1="490" y1="832" x2="490" y2="858" stroke="#38b888" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <rect x="440" y="862" width="100" height="28" rx="6" fill="#1a3828" stroke="#38b888" stroke-width="1.5"/>
  <text x="490" y="881" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600" fill="#90e8c0">saved ✓</text>

  <!-- ================================ -->
  <!-- BOTTOM BAR                       -->
  <!-- ================================ -->
  <rect x="0" y="900" width="1080" height="20" fill="#0B2240"/>
  <line x1="0" y1="900" x2="1080" y2="900" stroke="#2178A8" stroke-width="1" opacity="0.25"/>
  <text x="48" y="914" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" fill="#64748b">github.com/fidesit/utiska-skills</text>
  <text x="1032" y="914" text-anchor="end" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#8DC8E8">utisha.eu</text>
</svg>
